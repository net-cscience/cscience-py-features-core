[project]
name = "cscience-feature-text2sgd"
version = "0.1.0"
description = "Text2SDG feature integration for CScience."
requires-python = ">=3.13,<3.14"
dependencies = [
    "rpy2>=3.6.6,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/cscience"]
sources = ["src"]